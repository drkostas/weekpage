[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekpage"
version = "0.1.0"
description = "A printable weekly planner page, filled in from your calendars and the wind forecast"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Konstantinos Georgiou" }]
dependencies = ["jinja2>=3.1", "playwright>=1.45", "icalendar>=5", "recurring-ical-events>=2.2", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/drkostas/weekpage"

[project.scripts]
weekpage = "weekpage.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pymupdf>=1.24", "pypdf>=4", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weekpage = ["templates/*", "fonts/*"]
